<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <!-- SEO-friendly canonical link -->
  <link rel="canonical" href="https://ystc.in/">
  <!-- Tell search engines it's a permanent move -->
  <meta http-equiv="refresh" content="0; url=https://ystc.in/">
</head>
<body>
  <h1>We’ve moved! 🎉</h1>
  <p>You will be redirected to our new website at 
     <a href="https://ystc.in/">https://ystc.in/</a>.</p>
  <p>If you are not redirected automatically, please click the link above.</p>

  <script>
    // JavaScript hard redirect (acts like 301 for most bots + browsers)
    window.location.replace("https://ystc.in/");
  </script>
</body>
</html>
